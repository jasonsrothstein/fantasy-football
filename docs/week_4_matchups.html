<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1100" />
  <title>Pickle Fingers Week 4</title>
  <script src="https://cdn.plot.ly/plotly-2.35.0.min.js" charset="utf-8"></script>
  <style>
    :root {
      --bg:      #0f1419;
      --surface: #1a2332;
      --border:  #2d3a4f;
      --text:    #e6edf3;
      --muted:   #8b949e;
      --accent:  #58a6ff;
      --green:   #3fb950;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      padding: 2rem 1.5rem 3rem;
      min-height: 100vh;
    }
    header {
      max-width: 1100px;
      margin: 0 auto 2rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--border);
    }
    header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    header .subtitle {
      color: var(--muted);
      font-size: 0.95rem;
      margin-top: 0.4rem;
    }
    /* ── Week intro card ─────────────────────────────────────────────── */
    .week-intro {
      max-width: 1100px;
      margin: 0 auto 2rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.25rem 1.5rem 1.4rem;
    }
    .week-intro p {
      color: var(--text);
      line-height: 1.75;
      font-size: 0.95rem;
      margin-bottom: 0.65rem;
    }
    .week-intro p:last-child { margin-bottom: 0; }
    .week-intro img {
      max-width: 100%;
      border-radius: 8px;
      margin: 0.75rem auto;
      display: block;
    }
    .commentary-body img {
      max-width: 100%;
      border-radius: 8px;
      margin: 0.75rem auto;
      display: block;
    }
    .week-intro blockquote.twitter-tweet { margin: 0.75rem 0; }
    /* ── Legacy commentary section (YAML-based, kept for backward compat) ─ */
    .commentary-wrap {
      max-width: 1100px;
      margin: 0 auto 2.5rem;
    }
    .commentary-wrap h2 {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin-bottom: 0.85rem;
      color: var(--text);
    }
    .commentary-body {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.25rem 1.5rem 1.4rem;
      max-width: 750px;
    }
    .commentary-body p {
      color: var(--text);
      line-height: 1.75;
      font-size: 0.95rem;
      margin-bottom: 0.65rem;
    }
    .commentary-body p:last-child { margin-bottom: 0; }
    .commentary-body strong { color: #fff; }
    /* ── Markdown commentary section (new .md-based) ─────────────────── */
    .md-commentary {
      max-width: 600px;
      margin: 0 auto 2.5rem;
      padding: 0 1rem;
    }
    .md-commentary p {
      color: var(--text);
      line-height: 1.75;
      font-size: 0.95rem;
      margin: 0 0 1rem;
    }
    .md-commentary p:last-child { margin-bottom: 0; }
    .md-commentary strong { color: #fff; }
    .md-commentary em { color: #cdd9e5; }
    .md-commentary h1.md-h, .md-commentary h2.md-h,
    .md-commentary h3.md-h, .md-commentary h4.md-h {
      color: var(--text);
      font-weight: 700;
      margin: 1.5rem 0 0.5rem;
      letter-spacing: -0.01em;
    }
    .md-commentary h1.md-h { font-size: 1.25rem; }
    .md-commentary h2.md-h { font-size: 1.1rem; }
    .md-commentary h3.md-h { font-size: 1rem; }
    .md-commentary img.md-img {
      max-width: 100%;
      border-radius: 10px;
      margin: 0.75rem auto;
      display: block;
    }
    .md-commentary blockquote.twitter-tweet {
      margin: 0.5rem 0 1rem !important;
    }
    /* ── Legacy tweets section (tweets JSON, kept for backward compat) ── */
    .tweets-wrap {
      max-width: 1100px;
      margin: 0 auto 2.5rem;
    }
    .tweets-wrap h2 {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin-bottom: 1rem;
      color: var(--text);
    }
    .tweets-grid {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      max-width: 550px;
    }
    .tweet-item {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .tweet-comment {
      font-size: 0.92rem;
      color: var(--text);
      line-height: 1.55;
      margin: 0;
    }
    .tweet-item .twitter-tweet {
      margin: 0 !important;
    }
    /* ── Standings table ────────────────────────────────────────────── */
    .standings-wrap {
      max-width: 1100px;
      margin: 0 auto 2.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .standings-wrap h2 {
      align-self: flex-start;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin-bottom: 0.85rem;
      color: var(--text);
    }
    .standings-wrap .standings-table {
      margin: 0 auto;
    }
    .standings-table {
      width: auto;
      table-layout: auto;
      border-collapse: collapse;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      font-size: 0.88rem;
    }
    .standings-table col.col-rank { }
    .standings-table col.col-team { }
    .standings-table col.col-data { }
    .standings-table thead tr {
      background: #161b22;
    }
    .standings-table th {
      padding: 0.6rem 0.85rem;
      text-align: center;
      color: var(--muted);
      font-weight: 600;
      font-size: 0.78rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }
    .standings-table th.col-team-hdr { text-align: left; }
    .standings-table th:hover { color: var(--text); }
    .standings-table th.sort-asc::after  { content: ' ▲'; font-size: 0.65rem; }
    .standings-table th.sort-desc::after { content: ' ▼'; font-size: 0.65rem; }
    .standings-table td {
      padding: 0.55rem 0.85rem;
      border-top: 1px solid var(--border);
      vertical-align: middle;
      white-space: nowrap;
      text-align: center;
      color: var(--muted);
    }
    .standings-table td:nth-child(2) { text-align: left; }
    .standings-table tbody tr:hover { background: rgba(255,255,255,0.03); }
    .standings-table .rank {
      color: var(--muted);
      font-size: 0.8rem;
      width: 2rem;
      text-align: center;
      padding-right: 0.4rem;
    }
    .standings-table .col-team {
      display: flex;
      align-items: center;
      gap: 0.55rem;
    }
    .standings-table .col-team img {
      width: 28px; height: 28px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }
    .standings-table .team-name { font-weight: 500; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .standings-table .sort-active { font-weight: 700; color: #fff; }
    /* ── History chart ───────────────────────────────────────────────── */
    .history-wrap {
      max-width: 1100px;
      margin: 0 auto 2.5rem;
    }
    /* ── Player Leaderboard ──────────────────────────────────────────────── */
    .leaderboard-wrap {
      max-width: 1100px;
      margin: 0 auto 2.5rem;
    }
    .leaderboard-wrap h2 {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text);
      margin-bottom: 0.75rem;
    }
    .lb-tabs {
      display: flex;
      gap: 0.4rem;
      margin-bottom: 0.75rem;
      flex-wrap: wrap;
    }
    .lb-tab {
      background: var(--surface);
      border: 1px solid var(--border);
      color: #8b949e;
      border-radius: 6px;
      padding: 0.3rem 0.85rem;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .lb-tab:hover { background: #2d3a4f; color: var(--text); }
    .lb-tab.active {
      background: #1f6feb;
      border-color: #1f6feb;
      color: #fff;
      font-weight: 600;
    }
    .lb-chart-container {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.5rem;
      height: 300px;
      position: relative;
    }
    #lb-chart { width: 100%; height: 100%; }
    #lb-logos {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      overflow: hidden;
    }
    #lb-logos img {
      position: absolute;
      width: 28px; height: 28px;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      object-fit: cover;
      border: 2px solid #1a2332;
    }
    .lb-controls {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.55rem;
      flex-wrap: wrap;
    }
    .lb-play-btn {
      background: #1f6feb;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 0.28rem 0.85rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .lb-play-btn:hover { background: #388bfd; }
    .lb-week-btns {
      display: flex;
      gap: 0.3rem;
      flex-wrap: wrap;
    }
    .lb-wbtn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: #8b949e;
      border-radius: 5px;
      padding: 0.2rem 0.55rem;
      font-size: 0.78rem;
      cursor: pointer;
      transition: background 0.12s, color 0.12s;
    }
    .lb-wbtn:hover { background: #2d3a4f; color: var(--text); }
    .lb-wbtn.active {
      background: #2d3a4f;
      border-color: #58a6ff;
      color: #58a6ff;
      font-weight: 600;
    }
    .history-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 0.85rem;
    }
    .history-header h2 {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text);
      margin: 0;
    }
    .history-play-btn {
      background: rgba(88,166,255,0.12);
      border: 1px solid rgba(88,166,255,0.5);
      color: rgba(88,166,255,0.9);
      border-radius: 6px;
      padding: 3px 12px;
      font-size: 0.82rem;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .history-play-btn:hover {
      background: rgba(88,166,255,0.25);
      border-color: #58a6ff;
      color: #58a6ff;
    }
    .history-chart-container {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      height: 560px;
    }
    #history-chart { width: 100%; height: 100%; }
    #history-logos { position: absolute; inset: 0; pointer-events: none; }
    #history-logos img {
      position: absolute;
      width: 24px; height: 24px;
      border-radius: 50%;
      object-fit: cover;
      transform: translate(-50%, -50%);
      border: 2px solid var(--bg);
    }
    /* ── Matchup grid — single column ───────────────────────────────── */
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
      max-width: 1100px;
      margin: 0 auto;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }
    .card-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
      padding: 1rem 1.25rem 0.85rem;
      border-bottom: 1px solid var(--border);
    }
    .teams {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.95rem;
      font-weight: 600;
      flex-wrap: wrap;
    }
    .teams .sep    { color: var(--muted); font-weight: 400; font-size: 0.85rem; }
    .teams .winner { color: var(--accent); }
    .teams .loser  { color: var(--muted); }
    .team-logo {
      width: 26px; height: 26px; border-radius: 50%;
      object-fit: cover; flex-shrink: 0;
      background: var(--surface);
    }
    .score-box     { font-size: 0.9rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .score-box .sw { color: var(--green); font-weight: 600; }
    .score-box .ss { color: var(--muted); margin: 0 0.2em; }
    .score-box .sl { color: var(--muted); }
    .chart-wrap    { height: 340px; padding: 6px 0 0; position: relative; }
    .chart-div     { width: 100%; height: 100%; }
    /* ── Play / Replay overlay ───────────────────────────────────────── */
    .chart-overlay {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      z-index: 10; pointer-events: auto;
      background: transparent;
    }
    .chart-overlay.hidden { display: none; }
    .play-btn {
      width: 68px; height: 68px; border-radius: 50%;
      background: rgba(88,166,255,0.12);
      border: 2px solid rgba(88,166,255,0.7);
      color: rgba(88,166,255,0.9);
      font-size: 1.6rem; line-height: 1;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      padding-left: 5px;       /* optical centre for ▶ glyph */
      transition: background 0.18s, transform 0.12s, border-color 0.18s, color 0.18s;
    }
    .play-btn:hover {
      background: rgba(88,166,255,0.25);
      border-color: #58a6ff; color: #58a6ff;
      transform: scale(1.1);
    }
    .replay-btn {
      position: absolute; top: 14px; right: 14px;
      background: rgba(15,20,25,0.82);
      border: 1px solid var(--border);
      color: var(--muted); font-size: 0.78rem;
      padding: 4px 11px; border-radius: 6px;
      cursor: pointer; display: none; z-index: 10;
      transition: color 0.15s, border-color 0.15s;
    }
    .replay-btn:hover { color: var(--text); border-color: #58a6ff; }
    /* ── Per-matchup commentary ──────────────────────────────────────── */
    .commentary {
      padding: 1rem 1.25rem 1.4rem;
      border-top: 1px solid var(--border);
    }
    .commentary p {
      color: var(--text);
      line-height: 1.75;
      font-size: 0.93rem;
      margin-bottom: 0.75rem;
    }
    .commentary p:last-child { margin-bottom: 0; }
    .commentary img {
      max-width: 100%;
      max-height: 400px;
      border-radius: 8px;
      margin: 0.6rem 0;
      display: block;
    }
    .commentary blockquote.twitter-tweet { margin: 0.75rem 0; }
    /* ── Responsive ──────────────────────────────────────────────────── */
    @media (max-width: 640px) {
      .chart-wrap { height: 280px; }
      body        { padding: 1rem 0.75rem 2rem; }
      .play-btn   { width: 56px; height: 56px; font-size: 1.3rem; }
    }
    /* Proximity-based TD marker tooltip (fixed, pointer-events: none) */
    #td-tip {
      position: fixed;
      display: none;
      background: rgba(13,17,23,0.97);
      border: 1px solid #2d3a4f;
      border-radius: 6px;
      color: #e6edf3;
      font-size: 0.8rem;
      line-height: 1.5;
      max-width: 520px;
      padding: 7px 11px;
      pointer-events: none;
      z-index: 9999;
      box-shadow: 0 4px 18px rgba(0,0,0,0.55);
    }
  </style>
</head>

<!-- Floating tooltip for TD marker hover (proximity-based, outside Plotly unified hover) -->
<div id="td-tip"></div>
  <header>
    <h1>Pickle Fingers Week 4</h1>
    <p class="subtitle">Sep 29 – Oct 5, 2026</p>
  </header>
  <div class="md-commentary" id="md-commentary"></div>
  <div class="commentary-wrap" id="commentary-wrap"></div>
  <div class="tweets-wrap" id="tweets-wrap"></div>
  <div class="standings-wrap" id="standings-wrap"></div>
  <div class="history-wrap" id="history-wrap"></div>
  <div class="leaderboard-wrap" id="leaderboard-wrap"></div>
  <div style="max-width:1100px;margin:0 auto 0.85rem;"><h2 style="font-size:1.1rem;font-weight:700;letter-spacing:-0.01em;color:var(--text);">Matchups</h2></div>
  <div class="grid" id="grid"></div>

    (function() {

        // Support both plain URL strings and {url, comment} objects
