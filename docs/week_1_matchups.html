<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1100" />
  <title>Pickle Fingers Week 1</title>
  <script src="https://cdn.plot.ly/plotly-2.35.0.min.js" charset="utf-8"></script>
  <style>
    :root {
      --bg:      #0f1419;
      --surface: #1a2332;
      --border:  #2d3a4f;
      --text:    #e6edf3;
      --muted:   #8b949e;
      --accent:  #58a6ff;
      --green:   #3fb950;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      padding: 2rem 1.5rem 3rem;
      min-height: 100vh;
    }
    header {
      max-width: 1100px;
      margin: 0 auto 2rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--border);
    }
    header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    header .subtitle {
      color: var(--muted);
      font-size: 0.95rem;
      margin-top: 0.4rem;
    }
    /* ── Week intro card ─────────────────────────────────────────────── */
    .week-intro {
      max-width: 1100px;
      margin: 0 auto 2rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.25rem 1.5rem 1.4rem;
    }
    .week-intro p {
      color: var(--text);
      line-height: 1.75;
      font-size: 0.95rem;
      margin-bottom: 0.65rem;
    }
    .week-intro p:last-child { margin-bottom: 0; }
    .week-intro img {
      max-width: 100%;
      border-radius: 8px;
      margin: 0.75rem auto;
      display: block;
    }
    .commentary-body img {
      max-width: 100%;
      border-radius: 8px;
      margin: 0.75rem auto;
      display: block;
    }
    .week-intro blockquote.twitter-tweet { margin: 0.75rem 0; }
    /* ── Legacy commentary section (YAML-based, kept for backward compat) ─ */
    .commentary-wrap {
      max-width: 1100px;
      margin: 0 auto 2.5rem;
    }
    .commentary-wrap h2 {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin-bottom: 0.85rem;
      color: var(--text);
    }
    .commentary-body {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.25rem 1.5rem 1.4rem;
      max-width: 750px;
    }
    .commentary-body p {
      color: var(--text);
      line-height: 1.75;
      font-size: 0.95rem;
      margin-bottom: 0.65rem;
    }
    .commentary-body p:last-child { margin-bottom: 0; }
    .commentary-body strong { color: #fff; }
    /* ── Markdown commentary section (new .md-based) ─────────────────── */
    .md-commentary {
      max-width: 600px;
      margin: 0 auto 2.5rem;
      padding: 0 1rem;
    }
    .md-commentary p {
      color: var(--text);
      line-height: 1.75;
      font-size: 0.95rem;
      margin: 0 0 1rem;
    }
    .md-commentary p:last-child { margin-bottom: 0; }
    .md-commentary strong { color: #fff; }
    .md-commentary em { color: #cdd9e5; }
    .md-commentary h1.md-h, .md-commentary h2.md-h,
    .md-commentary h3.md-h, .md-commentary h4.md-h {
      color: var(--text);
      font-weight: 700;
      margin: 1.5rem 0 0.5rem;
      letter-spacing: -0.01em;
    }
    .md-commentary h1.md-h { font-size: 1.25rem; }
    .md-commentary h2.md-h { font-size: 1.1rem; }
    .md-commentary h3.md-h { font-size: 1rem; }
    .md-commentary img.md-img {
      max-width: 100%;
      border-radius: 10px;
      margin: 0.75rem auto;
      display: block;
    }
    .md-commentary blockquote.twitter-tweet {
      margin: 0.5rem 0 1rem !important;
    }
    /* ── Legacy tweets section (tweets JSON, kept for backward compat) ── */
    .tweets-wrap {
      max-width: 1100px;
      margin: 0 auto 2.5rem;
    }
    .tweets-wrap h2 {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin-bottom: 1rem;
      color: var(--text);
    }
    .tweets-grid {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      max-width: 550px;
    }
    .tweet-item {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .tweet-comment {
      font-size: 0.92rem;
      color: var(--text);
      line-height: 1.55;
      margin: 0;
    }
    .tweet-item .twitter-tweet {
      margin: 0 !important;
    }
    /* ── Standings table ────────────────────────────────────────────── */
    .standings-wrap {
      max-width: 1100px;
      margin: 0 auto 2.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .standings-wrap h2 {
      align-self: flex-start;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin-bottom: 0.85rem;
      color: var(--text);
    }
    .standings-wrap .standings-table {
      margin: 0 auto;
    }
    .standings-table {
      width: auto;
      table-layout: auto;
      border-collapse: collapse;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      font-size: 0.88rem;
    }
    .standings-table col.col-rank { }
    .standings-table col.col-team { }
    .standings-table col.col-data { }
    .standings-table thead tr {
      background: #161b22;
    }
    .standings-table th {
      padding: 0.6rem 0.85rem;
      text-align: center;
      color: var(--muted);
      font-weight: 600;
      font-size: 0.78rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }
    .standings-table th.col-team-hdr { text-align: left; }
    .standings-table th:hover { color: var(--text); }
    .standings-table th.sort-asc::after  { content: ' ▲'; font-size: 0.65rem; }
    .standings-table th.sort-desc::after { content: ' ▼'; font-size: 0.65rem; }
    .standings-table td {
      padding: 0.55rem 0.85rem;
      border-top: 1px solid var(--border);
      vertical-align: middle;
      white-space: nowrap;
      text-align: center;
      color: var(--muted);
    }
    .standings-table td:nth-child(2) { text-align: left; }
    .standings-table tbody tr:hover { background: rgba(255,255,255,0.03); }
    .standings-table .rank {
      color: var(--muted);
      font-size: 0.8rem;
      width: 2rem;
      text-align: center;
      padding-right: 0.4rem;
    }
    .standings-table .col-team {
      display: flex;
      align-items: center;
      gap: 0.55rem;
    }
    .standings-table .col-team img {
      width: 28px; height: 28px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }
    .standings-table .team-name { font-weight: 500; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .standings-table .sort-active { font-weight: 700; color: #fff; }
    /* ── History chart ───────────────────────────────────────────────── */
    .history-wrap {
      max-width: 1100px;
      margin: 0 auto 2.5rem;
    }
    /* ── Player Leaderboard ──────────────────────────────────────────────── */
    .leaderboard-wrap {
      max-width: 1100px;
      margin: 0 auto 2.5rem;
    }
    .leaderboard-wrap h2 {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text);
      margin-bottom: 0.75rem;
    }
    .lb-tabs {
      display: flex;
      gap: 0.4rem;
      margin-bottom: 0.75rem;
      flex-wrap: wrap;
    }
    .lb-tab {
      background: var(--surface);
      border: 1px solid var(--border);
      color: #8b949e;
      border-radius: 6px;
      padding: 0.3rem 0.85rem;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .lb-tab:hover { background: #2d3a4f; color: var(--text); }
    .lb-tab.active {
      background: #1f6feb;
      border-color: #1f6feb;
      color: #fff;
      font-weight: 600;
    }
    .lb-chart-container {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.5rem;
      height: 300px;
      position: relative;
    }
    #lb-chart { width: 100%; height: 100%; }
    #lb-logos {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      overflow: hidden;
    }
    #lb-logos img {
      position: absolute;
      width: 28px; height: 28px;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      object-fit: cover;
      border: 2px solid #1a2332;
    }
    .lb-controls {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.55rem;
      flex-wrap: wrap;
    }
    .lb-play-btn {
      background: #1f6feb;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 0.28rem 0.85rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .lb-play-btn:hover { background: #388bfd; }
    .lb-week-btns {
      display: flex;
      gap: 0.3rem;
      flex-wrap: wrap;
    }
    .lb-wbtn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: #8b949e;
      border-radius: 5px;
      padding: 0.2rem 0.55rem;
      font-size: 0.78rem;
      cursor: pointer;
      transition: background 0.12s, color 0.12s;
    }
    .lb-wbtn:hover { background: #2d3a4f; color: var(--text); }
    .lb-wbtn.active {
      background: #2d3a4f;
      border-color: #58a6ff;
      color: #58a6ff;
      font-weight: 600;
    }
    .history-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 0.85rem;
    }
    .history-header h2 {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text);
      margin: 0;
    }
    .history-play-btn {
      background: rgba(88,166,255,0.12);
      border: 1px solid rgba(88,166,255,0.5);
      color: rgba(88,166,255,0.9);
      border-radius: 6px;
      padding: 3px 12px;
      font-size: 0.82rem;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .history-play-btn:hover {
      background: rgba(88,166,255,0.25);
      border-color: #58a6ff;
      color: #58a6ff;
    }
    .history-chart-container {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      height: 560px;
    }
    #history-chart { width: 100%; height: 100%; }
    #history-logos { position: absolute; inset: 0; pointer-events: none; }
    #history-logos img {
      position: absolute;
      width: 24px; height: 24px;
      border-radius: 50%;
      object-fit: cover;
      transform: translate(-50%, -50%);
      border: 2px solid var(--bg);
    }
    /* ── Matchup grid — single column ───────────────────────────────── */
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
      max-width: 1100px;
      margin: 0 auto;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }
    .card-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
      padding: 1rem 1.25rem 0.85rem;
      border-bottom: 1px solid var(--border);
    }
    .teams {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.95rem;
      font-weight: 600;
      flex-wrap: wrap;
    }
    .teams .sep    { color: var(--muted); font-weight: 400; font-size: 0.85rem; }
    .teams .winner { color: var(--accent); }
    .teams .loser  { color: var(--muted); }
    .team-logo {
      width: 26px; height: 26px; border-radius: 50%;
      object-fit: cover; flex-shrink: 0;
      background: var(--surface);
    }
    .score-box     { font-size: 0.9rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .score-box .sw { color: var(--green); font-weight: 600; }
    .score-box .ss { color: var(--muted); margin: 0 0.2em; }
    .score-box .sl { color: var(--muted); }
    .chart-wrap    { height: 340px; padding: 6px 0 0; position: relative; }
    .chart-div     { width: 100%; height: 100%; }
    /* ── Play / Replay overlay ───────────────────────────────────────── */
    .chart-overlay {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      z-index: 10; pointer-events: auto;
      background: transparent;
    }
    .chart-overlay.hidden { display: none; }
    .play-btn {
      width: 68px; height: 68px; border-radius: 50%;
      background: rgba(88,166,255,0.12);
      border: 2px solid rgba(88,166,255,0.7);
      color: rgba(88,166,255,0.9);
      font-size: 1.6rem; line-height: 1;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      padding-left: 5px;       /* optical centre for ▶ glyph */
      transition: background 0.18s, transform 0.12s, border-color 0.18s, color 0.18s;
    }
    .play-btn:hover {
      background: rgba(88,166,255,0.25);
      border-color: #58a6ff; color: #58a6ff;
      transform: scale(1.1);
    }
    .replay-btn {
      position: absolute; top: 14px; right: 14px;
      background: rgba(15,20,25,0.82);
      border: 1px solid var(--border);
      color: var(--muted); font-size: 0.78rem;
      padding: 4px 11px; border-radius: 6px;
      cursor: pointer; display: none; z-index: 10;
      transition: color 0.15s, border-color 0.15s;
    }
    .replay-btn:hover { color: var(--text); border-color: #58a6ff; }
    /* ── Per-matchup commentary ──────────────────────────────────────── */
    .commentary {
      padding: 1rem 1.25rem 1.4rem;
      border-top: 1px solid var(--border);
    }
    .commentary p {
      color: var(--text);
      line-height: 1.75;
      font-size: 0.93rem;
      margin-bottom: 0.75rem;
    }
    .commentary p:last-child { margin-bottom: 0; }
    .commentary img {
      max-width: 100%;
      max-height: 400px;
      border-radius: 8px;
      margin: 0.6rem 0;
      display: block;
    }
    .commentary blockquote.twitter-tweet { margin: 0.75rem 0; }
    /* ── Responsive ──────────────────────────────────────────────────── */
    @media (max-width: 640px) {
      .chart-wrap { height: 280px; }
      body        { padding: 1rem 0.75rem 2rem; }
      .play-btn   { width: 56px; height: 56px; font-size: 1.3rem; }
    }
    /* Proximity-based TD marker tooltip (fixed, pointer-events: none) */
    #td-tip {
      position: fixed;
      display: none;
      background: rgba(13,17,23,0.97);
      border: 1px solid #2d3a4f;
      border-radius: 6px;
      color: #e6edf3;
      font-size: 0.8rem;
      line-height: 1.5;
      max-width: 520px;
      padding: 7px 11px;
      pointer-events: none;
      z-index: 9999;
      box-shadow: 0 4px 18px rgba(0,0,0,0.55);
    }
  </style>
</head>

<!-- Floating tooltip for TD marker hover (proximity-based, outside Plotly unified hover) -->
<div id="td-tip"></div>
  <header>
    <h1>Pickle Fingers Week 1</h1>
    <p class="subtitle">Sep 9 – Sep 14, 2026</p>
  </header>
  <div class="md-commentary" id="md-commentary"></div>
  <div class="commentary-wrap" id="commentary-wrap"></div>
  <div class="tweets-wrap" id="tweets-wrap"></div>
  <div class="standings-wrap" id="standings-wrap"></div>
  <div class="history-wrap" id="history-wrap"></div>
  <div class="leaderboard-wrap" id="leaderboard-wrap"></div>
  <div style="max-width:1100px;margin:0 auto 0.85rem;"><h2 style="font-size:1.1rem;font-weight:700;letter-spacing:-0.01em;color:var(--text);">Matchups</h2></div>
  <div class="grid" id="grid"></div>

 because the graphs look smooth, are replayable, mark each touchdown scored, and allow you to mouse over any point to see the score at that point (or the description of a touchdown). Thie method also - and by far, most importantly - does not require me to collect live data myself by leaving a Python script running on my laptop all weekend. That is what I was doing before, and why huge chunks of data would be missing when I was away from home with my laptop shut or just straight up forgot to start it.</p>\n<p>I have a couple more updates planned that I'll roll out next week, but feel free to let me know if you have any ideas because it's quite frankly fun as hell to make Claude write a casual million lines of code for our dumb fantasy league. Long live the pickle.</p>","week_commentary_html":"","tweet_urls":[{"url":"https://x.com/ghetto_gronk/status/2087236439331193240?s=20","comment":""},{"url":"https://x.com/OnyxOdds/status/2087212603701379094?s=20","comment":""},{"url":"https://x.com/Negrologizer/status/2088397183716360381?s=20","comment":""},{"url":"https://x.com/RealSkipBayless/status/2087903247914987680?s=20","comment":"Finally, what all sports fans were asking for: Skip Bayless' take on premarital sex."},{"url":"https://x.com/ATLVsTheWRLD/status/2089017747959091634?s=20","comment":""},{"url":"https://x.com/FindYessirski/status/2099272191338586140?s=20","comment":"Somehow this is the only good NFL tweet I saw this weekend. More to come..."}],"needs_twitter":true};

    // ── Standings table ────────────────────────────────────────────────────
    (function() {

      const DEFAULT_KEY = 'record';
      let sortKey  = DEFAULT_KEY;
      let clickCnt = 1;   // default view is already "first click" (desc) on record

      // Columns — rank is display-only (no sort); team sorts by name
      const cols = [

        { key: 'pr',     label: 'Power Ranking',        sortable: true,  numeric: true  },
        { key: 'etew',    label: 'ETEW',    sortable: true, numeric: true },
        { key: 'bs',      label: 'Pickles', sortable: true, numeric: true },
      ];

      // Returns sort value for a row given a key, higher = "better"
      function sortVal(row, key) {
        if (key === 'record' || key === 'rank') return row.wins * 1e6 + row.pf;
        if (key === 'pf')   return row.pf;
        if (key === 'pa')   return row.pa;
        if (key === 'etew') return row.etew_wins * 1e6 + row.pf;
        if (key === 'pr')   return row.pr != null ? row.pr : -Infinity;
        if (key === 'team') return 0;   // handled separately via localeCompare
        return row[key] != null ? row[key] : -Infinity;
      }

      // direction: 1 = desc (high→low first), -1 = asc (low→high first)
      function direction() { return clickCnt === 2 ? -1 : 1; }

      function sortedRows() {
        const copy = rows.map(r => ({...r}));
        copy.sort((a, b) => {
          const dir = direction();
          if (sortKey === 'team') {
            return dir * (a.team_name || '').localeCompare(b.team_name || '');
          }
          const av = sortVal(a, sortKey), bv = sortVal(b, sortKey);
          // dir=-1 (desc): bv-av puts larger values first
          // dir=1  (asc):  av-bv puts smaller values first
          return dir * (bv - av);
        });
        return copy;
      }

      function renderTable() {
        const sorted = sortedRows();

        });
        tbl.appendChild(cg);

        // Header
        const thead = tbl.createTHead();
        const hr = thead.insertRow();
        cols.forEach(col => {

          if (col.key === 'team') th.classList.add('col-team-hdr');

          if (isActive) {

            th.classList.add(dir === 1 ? 'sort-desc' : 'sort-asc');
          }

          if (col.sortable) {
            th.style.cursor = 'pointer';
            th.addEventListener('click', () => {
              if (sortKey === col.key) {

                if (clickCnt > 3) clickCnt = 1;
                if (clickCnt === 3) {
                  // Reset to default
                  sortKey  = DEFAULT_KEY;
                  clickCnt = 1;
                }
              } else {

          const tdRank = tr.insertCell();

          // Team (logo + name)

      const METRICS = {

      // ── Helpers ─────────────────────────────────────────────────────────

      // Compute a tight y-range from a flat array of values, with 8% padding.
      function computeYRange(flatVals) {
        const valid = flatVals.filter(v => v != null && isFinite(v));
        if (!valid.length) return null;
        const mn = Math.min(...valid), mx = Math.max(...valid);
        const pad = (mx - mn) * 0.08 || 1;
        const m = METRICS[currentMetric];

        return {

        const fl = chartDiv._fullLayout;
        if (!fl) return;
        const xa = fl.xaxis, ya = fl.yaxis;
        const cRect = chartDiv.getBoundingClientRect();
        const pRect = logosDiv.parentElement.getBoundingClientRect();
        teamNames.forEach(name => {
          const el = logoEls[name];
          if (!el) return;
          const ep = endpoints[name];
          if (!ep) { el.style.display = 'none'; return; }
          try {
            const px = xa.l2p(ep.x) + xa._offset + (cRect.left - pRect.left);
            const py = ya.l2p(ep.y) + ya._offset + (cRect.top  - pRect.top);
            el.style.left    = px + 'px';
            el.style.top     = py + 'px';
            el.style.display = '';
          } catch(_) { el.style.display = 'none'; }
        });
      }

      // Compute endpoints from histData for a static week
      function endpointsForWeek(upToWeek) {
        const m = METRICS[currentMetric];
        const ep = {};
        teamNames.forEach(name => {
          let lx=null, ly=null;
          weeks.filter(w=>w<=upToWeek).forEach(w=>{
            const row=(histData[String(w)]||[]).find(r=>r.team_name===name);
            if (row) { lx=w; ly=m.extract(row); }
          });
          if (lx!==null) ep[name]={x:lx, y:ly};
        });
        return ep;
      }

      // Static (non-animated) render of all weeks up to upToWeek
      function render(upToWeek) {
        const m = METRICS[currentMetric];
        titleEl.textContent = m.title;
        const xMin = m.cumulative ? weeks[0]-1.2 : weeks[0]-0.5;
        const traces = teamNames.map(name => {
          const xs=[], ys=[], wels=[];
          if (m.cumulative) { xs.push(weeks[0]-1); ys.push(0); wels.push(null); }
          weeks.filter(w=>w<=upToWeek).forEach(w=>{
            const v=getVal(name,w);
            if(v!=null){xs.push(w);ys.push(v);wels.push(w);}
          });
          return makeTrace(name, xs, ys, wels);
        }).filter(t=>t.x.length>0);
        // For zoom, use only each team's latest (most recent) value
        let yRange = null, xRange = null;
        if (zoomed) {
          const zoomY = [];
          teamNames.forEach(name => {
            const latestWk = [...weeks].reverse().find(w => w <= upToWeek && getVal(name, w) != null);
            if (latestWk != null) zoomY.push(getVal(name, latestWk));
          });
          yRange = computeYRange(zoomY);
          xRange = centeredXRange(xMin, upToWeek);
        }
        Plotly.react(chartDiv, traces, buildLayout(xMin, yRange, xRange), {responsive:true,displayModeBar:false})
          .then(() => {
            positionLogos(endpointsForWeek(upToWeek));
            // Shift hover labels right by the logo radius so they never overlap the
            // team logo circles. Use a MutationObserver so the shift applies every
            // time Plotly repositions the label (not just on the initial hover event).
            // Per-element _ourTransform guard prevents infinite mutation loops.
            if (!render._hoverShiftDone) {
              render._hoverShiftDone = true;
              new MutationObserver(function(muts) {
                muts.forEach(function(m) {
                  var g = m.target;
                  if (!g.classList || !g.classList.contains('hovertext')) return;
                  var t = g.getAttribute('transform') || '';
                  if (t === g._ourTransform) return; // we set this — skip
                  var mo = t.match(/translate\(\s*([+-]?[\d.]+)[,\s]+([+-]?[\d.]+)\s*\)/);
                  if (!mo) return;
                  g._ourTransform = 'translate(' + (parseFloat(mo[1]) + 12) + ',' + mo[2] + ')';
                  g.setAttribute('transform', g._ourTransform);
                });
              }).observe(chartDiv, { subtree: true, attributeFilter: ['transform'] });
            }
          });
      }

      // ── Animation ───────────────────────────────────────────────────────
      function stopAnim() {
        if (animRAF_id)   { cancelAnimationFrame(animRAF_id); animRAF_id=null; }
        if (animTimer_id) { clearTimeout(animTimer_id); animTimer_id=null; }
        animRunning = false;
      }

      function startAnim() {
        stopAnim();
        animRunning = true;
        playBtn.textContent = '■ Stop';

        const m       = METRICS[currentMetric];
        const STEP_MS = 1500;   // ms per week-to-week transition
        const PAUSE   = 300;    // ms pause between steps

        // Animation sequence: for cumulative metrics prepend a null "origin week"
        const seq = m.cumulative ? [null, ...weeks] : [...weeks];
        // x-coordinate for a sequence element
        const seqX = el => (el===null ? weeks[0]-1 : el);

        let stepIdx = 1;  // animating from seq[stepIdx-1] → seq[stepIdx]

        // ── Initial frame: show only the starting point ─────────────────
        const xMin = m.cumulative ? weeks[0]-1.2 : weeks[0]-0.5;
        titleEl.textContent = m.title;
        const initTraces = teamNames.map(name => makeTrace(name,
          [seqX(seq[0])],
          [m.cumulative ? 0 : (getVal(name, seq[0]) ?? 0)],
          [seq[0]]));
        const initEndpoints = {};
        teamNames.forEach(name => {
          initEndpoints[name] = {
            x: seqX(seq[0]),
            y: m.cumulative ? 0 : (getVal(name, seq[0]) ?? 0),
          };
        });
        // Pre-compute the full-season y-range so the axis is already sized
        // for the final frame from the very first frame (full scope mode).
        const allFinalY = seq.flatMap(el =>
          teamNames.map(name => el===null ? 0 : (getVal(name,el)??0))
        );
        const fullYRange = computeYRange(allFinalY);

        const initYRange = zoomed ? computeYRange(initTraces.flatMap(tr => tr.y))
                                  : fullYRange;
        Plotly.react(chartDiv, initTraces, buildLayout(xMin, initYRange),
                     {responsive:true, displayModeBar:false})
          .then(() => positionLogos(initEndpoints));

        // Tip y-values for all teams at a sequence element (null = virtual origin).
        function tipsAt(el) {
          return teamNames.map(name => el===null ? 0 : (getVal(name,el)??0));
        }

        function runStep() {
          if (stepIdx >= seq.length || !animRunning) {
            animRunning = false;
            playBtn.textContent = '↺ Replay';
            // Re-render with proper customdata now that animation is done
            // (the last frame used null weekEl for the tip, leaving decimals).
            render(maxWeek);
            return;
          }

          const fromEl = seq[stepIdx-1];
          const toEl   = seq[stepIdx];
          const fromX  = seqX(fromEl);
          const toX    = seqX(toEl);
          const t0     = performance.now();

          // Pre-compute axis ranges at both boundaries so we can lerp between
          // them at a constant rate — avoids lurching when teams overtake each other.
          const fromYRange = zoomed ? computeYRange(tipsAt(fromEl)) : null;
          const toYRange   = zoomed ? computeYRange(tipsAt(toEl))   : null;
          const fromXR     = zoomed ? centeredXRange(xMin, fromX)   : null;
          const toXR       = zoomed ? centeredXRange(xMin, toX)     : null;

          function lerpRange(a, b, t) {
            if (!a || !b) return a || b || null;
            return [a[0] + t*(b[0]-a[0]), a[1] + t*(b[1]-a[1])];
          }

          function frame(now) {
            if (!animRunning) return;
            const t = Math.min((now - t0) / STEP_MS, 1);

            // For each team: completed points + current interpolated tip
            const newX=[], newY=[], newCD=[];
            const liveEndpoints = {};
            teamNames.forEach(name => {
              const xs=[], ys=[], wels=[];
              // All completed waypoints (seq[0]..seq[stepIdx-1])
              seq.slice(0, stepIdx).forEach(el => {
                xs.push(seqX(el));
                ys.push(el===null ? 0 : (getVal(name,el)??0));
                wels.push(el);
              });
              // Animating tip — at t=1 (landed) use the real destination weekEl
              // so hover labels are formatted correctly (e.g. ETEW shows "W-L").
              const fv      = fromEl===null ? 0 : (getVal(name,fromEl)??0);
              const tv      = toEl===null   ? 0 : (getVal(name,toEl)??fv);
              const tipX    = fromX + t*(toX-fromX);
              const tipY    = fv    + t*(tv-fv);
              const tipWel  = (t >= 1) ? toEl : null;
              xs.push(tipX); ys.push(tipY); wels.push(tipWel);
              newX.push(xs); newY.push(ys);
              // customdata: format each point with proper label
              newCD.push(ys.map((y, i) => fmtY(y, name, wels[i])));
              liveEndpoints[name] = { x:tipX, y:tipY };
            });

            if (zoomed) {
              // Linearly interpolate the pre-computed boundary ranges.
              const yRange   = lerpRange(fromYRange, toYRange, t);
              const xr       = lerpRange(fromXR,     toXR,     t);
              const tickVals = weeks.filter(w => w >= Math.ceil(xr[0]) && w <= Math.ceil(xr[1]));
              Plotly.update(chartDiv,
                {x: newX, y: newY, customdata: newCD},
                {
                  ...(yRange ? {'yaxis.range': yRange, 'yaxis.autorange': false} : {}),
                  'xaxis.range':    xr,
                  'xaxis.tickvals': tickVals,
                  'xaxis.ticktext': tickVals.map(w => 'Week ' + w),
                }
              );
            } else {
              // Keep y-axis locked to the pre-computed full-season range so
              // it doesn't grow as more data is drawn in each frame.
              Plotly.update(chartDiv,
                {x: newX, y: newY, customdata: newCD},
                fullYRange ? {'yaxis.range': fullYRange, 'yaxis.autorange': false} : {}
              );
            }
            positionLogos(liveEndpoints);

            if (t < 1) {
              animRAF_id = requestAnimationFrame(frame);
            } else {
              stepIdx++;
              animTimer_id = setTimeout(runStep, PAUSE);
            }
          }

          animRAF_id = requestAnimationFrame(frame);
        }

        animTimer_id = setTimeout(runStep, 150);
      }

      // ── Controls ────────────────────────────────────────────────────────
      playBtn.addEventListener('click', () => {
        if (animRunning) {
          stopAnim();
          playBtn.textContent = '▶ Play';
        } else {
          startAnim();
        }
      });

      // Sync zoom button visibility/label to the current metric.
      function syncZoomBtn() {
        if (currentMetric === 'record') {
          zoomBtn.style.display = 'none';
          // Reset zoom state when hiding so switching back to a metric
          // doesn't start in a stale zoomed state.
          zoomed = false;
        } else {
          zoomBtn.style.display = '';
          zoomBtn.textContent = zoomed ? '↔ Full Scope' : 'Zoom to Fit';
        }
      }
      syncZoomBtn();   // initialise on page load

      zoomBtn.addEventListener('click', () => {
        zoomed = !zoomed;
        zoomBtn.textContent = zoomed ? '↔ Full Scope' : 'Zoom to Fit';
        if (!animRunning) render(maxWeek);
        // If animating, the next frame will pick up the new zoomed value automatically
      });

      // Called by standings table column-header clicks
      window._updateHistoryChart = function(colKey) {
        stopAnim();
        playBtn.textContent = '▶ Play';
        // Pickles, team-name sort → show standings (rank)
        currentMetric = METRICS[colKey] ? colKey : 'record';
        syncZoomBtn();
        render(maxWeek);
      };

      window.addEventListener('resize', () => positionLogos(endpointsForWeek(maxWeek)));

      render(maxWeek);   // initial static render
    })();

    // ── X-axis: sequential play indices (dead time compressed out) ─────────
    // Each element of DATA.times is an ISO timestamp for one play/event.
    // We plot on 0-based integer indices so there is no wasted horizontal
    // space between game windows (Thursday → Sunday gap, etc.).
    // Tick labels are placed wherever the gap between consecutive timestamps
    // exceeds GAP_MS, which marks the start of a new game window.

    // All times are displayed in US Eastern Time so day labels and hover
    // tooltips are consistent for every viewer regardless of their timezone.
    function toET(d) {
      // Returns a plain Date whose .getHours()/.getDay() etc. reflect ET.
      // Leverages the Intl API (supported in all modern browsers).
      const etStr = d.toLocaleString('en-US', { timeZone: 'America/New_York' });
      return new Date(etStr);
    }

    function fmtTime(d) {
      const et = toET(d);
      const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
      let h = et.getHours(), mi = et.getMinutes();
      const ap = h >= 12 ? 'pm' : 'am';
      h = ((h + 11) % 12) + 1;
      return DAYS[et.getDay()] + ' ' + h +
             (mi ? ':' + String(mi).padStart(2, '0') : '') + ap;
    }

    function buildXAxis(times) {
      const DAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday',
                         'Thursday','Friday','Saturday'];
      const xVals      = times.map((_, i) => i);
      const hoverText  = times.map(t => fmtTime(new Date(t)));  // "Thu 8:20pm" per minute

      // Identify ET day boundaries, with a special split for Sunday Night
      // (8:10 pm ET = the SNF kickoff window).
      const SUN_NIGHT_MINS = 20 * 60 + 10;   // 8:10 pm ET in minutes-since-midnight

      const dayBoundaries = [];
      const dayMidpoints  = [];
      const dayNames      = [];

      let dayStart   = 0;
      let currentDay = toET(new Date(times[0])).toDateString();

      for (let i = 1; i <= times.length; i++) {
        const dayKey = i < times.length
          ? toET(new Date(times[i])).toDateString()
          : null;

        if (dayKey !== currentDay) {
          const dayEnd = i - 1;
          const dayNum = toET(new Date(times[dayStart])).getDay();

          if (dayNum === 0) {
            // Sunday: look for the first play at or after 8:10 pm ET to mark SNF.
            let snbIdx = -1;
            for (let j = dayStart; j <= dayEnd; j++) {
              const et = toET(new Date(times[j]));
              if (et.getHours() * 60 + et.getMinutes() >= SUN_NIGHT_MINS) {
                snbIdx = j;
                break;
              }
            }

            if (snbIdx > dayStart) {
              // Sunday daytime section
              dayMidpoints.push((dayStart + snbIdx - 1) / 2);
              dayNames.push('Sunday');
              // Separator before Sunday Night
              dayBoundaries.push(snbIdx - 0.5);
              // Sunday Night section
              dayMidpoints.push((snbIdx + dayEnd) / 2);
              dayNames.push('Sunday Night');
            } else {
              // All plays are either before 8:10 pm (no SNF) or all after (pure SNF week).
              dayMidpoints.push((dayStart + dayEnd) / 2);
              dayNames.push(snbIdx === dayStart ? 'Sunday Night' : 'Sunday');
            }
          } else {
            dayMidpoints.push((dayStart + dayEnd) / 2);
            dayNames.push(DAY_NAMES[dayNum]);
          }

          if (i < times.length) {
            dayBoundaries.push(i - 0.5);
          }
          dayStart   = i;
          currentDay = dayKey;
        }
      }

      // Annotations draw the day name labels below the plot area.
      // xaxis.ticktext (all minutes) drives the unified-hover header instead.
      const dayAnnotations = dayMidpoints.map((x, k) => ({
        x, y: -0.07,
        xref: 'x', yref: 'paper',
        text: dayNames[k],
        showarrow: false,
        font: { color: '#8b949e', size: 11 },
        xanchor: 'center', yanchor: 'top',
      }));

      return { xVals, hoverText, dayBoundaries, dayAnnotations };
    }

    // ── Per-matchup segment filtering ─────────────────────────────────────
    // Returns an array of indices into DATA.times covering only the day windows
    // (Thu / Sun / Sun Night / Mon) in which at least one of the two teams
    // scored. Segments where both score arrays are flat are dropped entirely,
    // compressing away windows that had no fantasy impact for this matchup.
    const _SUN_NIGHT_MINS = 20 * 60 + 10;   // 8:10 pm ET in minutes-since-midnight
    function activeIndicesFor(pts1, pts2) {
      const times = DATA.times;
      if (!times || !times.length) return times.map((_, i) => i);

      const activeIdx = [];
      let dayStart   = 0;
      let currentDay = toET(new Date(times[0])).toDateString();

      for (let i = 1; i <= times.length; i++) {
        const dayKey = i < times.length
          ? toET(new Date(times[i])).toDateString()
          : null;

        if (dayKey !== currentDay) {
          const dayEnd = i - 1;
          const dayNum = toET(new Date(times[dayStart])).getDay();

          // Build sub-segments (Sunday is split at SNF boundary)
          const subSegs = [];
          if (dayNum === 0) {
            let snbIdx = -1;
            for (let j = dayStart; j <= dayEnd; j++) {
              const et = toET(new Date(times[j]));
              if (et.getHours() * 60 + et.getMinutes() >= _SUN_NIGHT_MINS) {
                snbIdx = j; break;
              }
            }
            if (snbIdx > dayStart) {
              subSegs.push([dayStart, snbIdx - 1]);
              subSegs.push([snbIdx,   dayEnd]);
            } else {
              subSegs.push([dayStart, dayEnd]);
            }
          } else {
            subSegs.push([dayStart, dayEnd]);
          }

          subSegs.forEach(([s, e]) => {
            const v1 = [], v2 = [];
            for (let j = s; j <= e; j++) {
              if (pts1[j] != null) v1.push(pts1[j]);
              if (pts2[j] != null) v2.push(pts2[j]);
            }
            const anyScore = v => v.length > 1 && Math.max(...v) > Math.min(...v);
            if (anyScore(v1) || anyScore(v2)) {
              for (let j = s; j <= e; j++) activeIdx.push(j);
            }
          });

          dayStart   = i;
          currentDay = dayKey;
        }
      }
      return activeIdx;
    }

    // ── layout factory (per-chart Y range + per-chart axis labels) ─────
    function baseLayout(yMax, dayBoundaries, dayAnnotations) {
      const shapes = dayBoundaries.map(x => ({
        type: 'line',
        x0: x, x1: x,
        y0: 0, y1: 1, yref: 'paper',
        line: { color: '#2d3a4f', width: 1.5 }
      }));

      return {
        paper_bgcolor: '#1a2332',
        plot_bgcolor:  '#0f1419',
        font: { color: '#e6edf3', family: "'Segoe UI', system-ui, sans-serif", size: 12 },
        margin: { t: 10, r: 20, b: 56, l: 54, pad: 2 },
        hovermode: 'x unified',
        shapes,
        // Day name labels are annotations rather than axis ticktext,
        // freeing ticktext to carry per-minute time strings for the hover header.
        annotations: dayAnnotations,
        xaxis: {
          type: 'linear',
          gridcolor: '#2d3a4f', linecolor: '#2d3a4f',
          zeroline: false,        // suppress the default line drawn at x=0
          // tickvals/ticktext are set per-matchup by renderChart after this call.
          showticklabels: false,  // axis labels come from annotations
          showgrid: false,
        },
        yaxis: {
          gridcolor: '#2d3a4f', linecolor: '#2d3a4f',
          zerolinecolor: '#2d3a4f',
          tickfont: { color: '#8b949e', size: 11 },
          title: { text: 'Points', font: { color: '#8b949e', size: 11 }, standoff: 6 },
          range: [0, yMax],
          fixedrange: false,
        },
        legend: {
          bgcolor: 'rgba(15,20,25,0.8)', bordercolor: '#2d3a4f', borderwidth: 1,
          font: { size: 10, color: '#8b949e' },
          x: 0.01, xanchor: 'left', y: 0.99, yanchor: 'top',
        },
      };
    }

    const plotConfig = {
      responsive: true,
      displayModeBar: false,   // hide the zoom/pan/reset toolbar entirely
    };

    // ── Player Leaderboard (bar-chart race) ──────────────────────────────────────
    (function() {
      const LB        = DATA.player_leaderboard || {};
      const POSITIONS = ['QB','RB','WR','TE','K','DEF'];
      const TOP5      = 5;
      const WEEKS     = DATA.standings_history
        ? Object.keys(DATA.standings_history).map(Number).sort((a,b)=>a-b) : [];
      const lbWrap = document.getElementById('leaderboard-wrap');
      if (!lbWrap || !Object.keys(LB).length || !WEEKS.length) return;

      const STEP_MS  = 2600;   // ms per week step
      const PAUSE_MS = 400;    // ms to hold at each completed week
      const OFF_Y   = 6.5;    // off-screen rank (below chart)
      const BAR_W   = 0.60;   // bar height in rank units
      const PALETTE = ['#58a6ff','#f78166','#3fb950','#d2a8ff','#ffa657',
                        '#79c0ff','#ff7b72','#56d364','#bc8cff','#ffc680',
                        '#39d353','#ff9492'];

      let currentPos = POSITIONS[0];
      let lbAnimReq  = null;
      let lbShownWk  = WEEKS[WEEKS.length - 1];
      let colorMap   = {};
      let lbPlayed   = false;   // true once animation has run for currentPos

      // ── HTML shell ───────────────────────────────────────────────────────
      const h2 = document.createElement('h2');
      h2.textContent = 'Player Leaderboards';
      lbWrap.appendChild(h2);

      const tabBar = document.createElement('div');
      tabBar.className = 'lb-tabs';
      lbWrap.appendChild(tabBar);

      const chartWrap = document.createElement('div');
      chartWrap.className = 'lb-chart-container';
      chartWrap.innerHTML = '<div id="lb-chart"></div><div id="lb-logos"></div>';
      lbWrap.appendChild(chartWrap);

      const controlsRow = document.createElement('div');
      controlsRow.className = 'lb-controls';
      lbWrap.appendChild(controlsRow);

      const playBtn = document.createElement('button');
      playBtn.className = 'lb-play-btn';
      playBtn.textContent = '▶ Play';
      controlsRow.appendChild(playBtn);

      const weekBtnsWrap = document.createElement('div');
      weekBtnsWrap.className = 'lb-week-btns';
      controlsRow.appendChild(weekBtnsWrap);

      const logosDiv = document.getElementById('lb-logos');
      const chartDiv = document.getElementById('lb-chart');
      const logoEls  = {};

      // ── Helpers ───────────────────────────────────────────────────────────
      function ord(n) {
        const s=['th','st','nd','rd'], v=n%100;
        return n+(s[(v-20)%10]||s[v]||s[0]);
      }
      function initialsURI(name) {
        const parts = (name||'').replace(/ DEF$/,'').split(/\s+/);
        const ini = parts.length >= 2
          ? (parts[0][0]||'')+(parts[parts.length-1][0]||'')
          : (parts[0]||'?').slice(0,2);
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28">
          <circle cx="14" cy="14" r="14" fill="#2d3a4f"/>
          <text x="14" y="19" text-anchor="middle" font-family="sans-serif"
                font-size="11" font-weight="bold" fill="#e6edf3">${ini.toUpperCase()}</text></svg>`;
        return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
      }
      function cumulAt(player, wk) {
        let tot = 0;
        for (const w of WEEKS) {
          if (w > wk) break;
          tot += (player.weeks[String(w)] || 0);
        }
        return Math.round(tot * 100) / 100;
      }
      function top5At(players, wk) {
        return [...players]
          .map(p => ({...p, _c: cumulAt(p, wk)}))
          .sort((a,b) => b._c - a._c)
          .slice(0, TOP5);
      }
      function easeInOut(t) {
        return t < 0.5 ? 2*t*t : -1+(4-2*t)*t;
      }
      // NFL team primary colors — chosen for readability on a dark background.
      // Very dark primaries (Raiders black, Bears navy, Browns brown, etc.)
      // use the team's accent/secondary color instead.
      const NFL_TEAM_COLORS = {
        ARI: '#97233F', ATL: '#A71930', BAL: '#241773', BUF: '#00338D',
        CAR: '#0085CA', CHI: '#C83803', CIN: '#FB4F14', CLE: '#FF3C00',
        DAL: '#003594', DEN: '#FB4F14', DET: '#0076B6', GB:  '#203731',
        HOU: '#03202F', IND: '#002C5F', JAX: '#006778', KC:  '#E31837',
        LAC: '#0080C6', LAR: '#003594', LV:  '#A5ACAF', MIA: '#008E97',
        MIN: '#4F2683', NE:  '#002244', NO:  '#9F8958', NYG: '#0B2265',
        NYJ: '#125740', PHI: '#004C54', PIT: '#FFB612', SEA: '#69BE28',
        SF:  '#AA0000', TB:  '#D50A0A', TEN: '#4B92DB', WAS: '#5A1414',
      };
      function rebuildColorMap() {
        colorMap = {};
        (LB[currentPos] || []).forEach((p, i) => {
          colorMap[p.name] = NFL_TEAM_COLORS[p.nfl_team] || PALETTE[i % PALETTE.length];
        });
      }

      // ── Logo management ───────────────────────────────────────────────────
      function ensureLogos(players) {
        Object.keys(logoEls).forEach(n => {
          if (!players.find(p => p.name === n)) { logoEls[n].remove(); delete logoEls[n]; }
        });
        players.forEach(p => {
          if (logoEls[p.name]) return;
          const img = document.createElement('img');
          img.style.display = 'none';
          const fb = initialsURI(p.name);
          if (p.photo_url) { img.src = p.photo_url; img.onerror = ()=>{ img.src=fb; }; }
          else img.src = fb;
          logosDiv.appendChild(img);
          logoEls[p.name] = img;
        });
      }
      function positionLogosLB(endpoints) {
        const fl = chartDiv._fullLayout;
        if (!fl) return;
        const xa = fl.xaxis, ya = fl.yaxis;
        const cR = chartDiv.getBoundingClientRect();
        const pR = logosDiv.parentElement.getBoundingClientRect();
        Object.values(logoEls).forEach(el => { el.style.display = 'none'; });
        Object.entries(endpoints).forEach(([name, {x,y}]) => {
          const el = logoEls[name];
          if (!el) return;
          try {
            const px = xa.l2p(x) + xa._offset + (cR.left - pR.left);
            const py = ya.l2p(y) + ya._offset + (cR.top  - pR.top);
            el.style.left = px + 'px';
            el.style.top  = py + 'px';
            // Fill circle background with the bar's own color
            el.style.backgroundColor = colorMap[name] || PALETTE[0];
            el.style.display = '';
          } catch(_) {}
        });
      }

      // ── State: {name: {rank,pts}} for top-5 at wk ─────────────────────
      function stateAt(players, wk) {
        const s = {};
        top5At(players, wk).forEach((p,i) => {
          s[p.name] = {rank:i+1, pts:cumulAt(p,wk)};
        });
        return s;
      }

      // ── Format a point total: trim trailing zeros but keep up to 2 decimals ─
      // 93.46→"93.46"  45.50→"45.5"  45.00→"45"
      function fmtPts(v) { return parseFloat(v.toFixed(2)).toString(); }

      // ── Build Plotly bar traces from {name:{rank,pts}} ─────────────────
      function buildBarTraces(lerpState) {
        return Object.entries(lerpState).map(([name, {rank,pts}]) => {
          const color = colorMap[name] || PALETTE[0];
          const ptsStr = pts >= 0.5 ? '  '+fmtPts(pts) : '';
          return {
            type:'bar', orientation:'h',
            y:[rank], x:[pts], width:[BAR_W], base:[0],
            text:[name+ptsStr],
            textposition:'inside', insidetextanchor:'start',
            textfont:{color:'#fff',size:11,family:'Segoe UI,system-ui,sans-serif'},
            marker:{color:color, opacity:0.88, line:{color:'#0d1117',width:1}},
            hovertemplate:'<b>'+name+'</b><br>'+
              (rank<=TOP5+0.5 ? currentPos+Math.round(rank)+' · ' : '')+
              fmtPts(pts)+' pts<extra></extra>',
            showlegend:false,
            cliponaxis:true,
          };
        });
      }

      // ── Bar chart layout ───────────────────────────────────────────────────
      function barLayout(xMax) {
        return {
          paper_bgcolor:'rgba(0,0,0,0)', plot_bgcolor:'rgba(0,0,0,0)',
          margin:{t:6,b:36,l:8,r:8},
          font:{color:'#8b949e',family:'Segoe UI,system-ui,sans-serif',size:11},
          showlegend:false, barmode:'overlay',
          xaxis:{
            gridcolor:'#2d3a4f', linecolor:'#2d3a4f',
            range:[0, xMax*1.15],
            tickformat:'.0f',
            title:{text:'Cumulative Fantasy Points',font:{size:10}},
          },
          yaxis:{
            type:'linear', range:[TOP5+0.7, 0.3],
            tickvals:[], showticklabels:false,
            gridcolor:'rgba(0,0,0,0)', zeroline:false, fixedrange:true,
          },
          hovermode:'closest',
        };
      }

      // ── Week-button sync ──────────────────────────────────────────────────
      function syncWkBtns(wk) {
        document.querySelectorAll('.lb-wbtn').forEach(b =>
          b.classList.toggle('active', Number(b.dataset.week)===wk));
      }

      // ── Static render ─────────────────────────────────────────────────────
      function renderLB(upToWk) {
        if (lbAnimReq) { cancelAnimationFrame(lbAnimReq); lbAnimReq = null; }
        lbShownWk = upToWk;
        const players = LB[currentPos] || [];
        if (!players.length) { Plotly.purge(chartDiv); return; }

        rebuildColorMap();
        ensureLogos(players);

        const state  = stateAt(players, upToWk);
        const maxPts = Math.max(...Object.values(state).map(s => s.pts), 1);
        const traces = buildBarTraces(state);

        Plotly.react(chartDiv, traces, barLayout(maxPts), {responsive:true,displayModeBar:false})
          .then(() => {
            const ep = {};
            Object.entries(state).forEach(([name, {rank,pts}]) => {
              ep[name] = {x:pts, y:rank};
            });
            positionLogosLB(ep);
            // Shift hover labels right by the player photo radius (14 px = half of 28 px).
            if (!renderLB._hoverShiftDone) {
              renderLB._hoverShiftDone = true;
              new MutationObserver(function(muts) {
                muts.forEach(function(m) {
                  var g = m.target;
                  if (!g.classList || !g.classList.contains('hovertext')) return;
                  var t = g.getAttribute('transform') || '';
                  if (t === g._ourTransform) return; // we set this — skip
                  var mo = t.match(/translate\(\s*([+-]?[\d.]+)[,\s]+([+-]?[\d.]+)\s*\)/);
                  if (!mo) return;
                  g._ourTransform = 'translate(' + (parseFloat(mo[1]) + 14) + ',' + mo[2] + ')';
                  g.setAttribute('transform', g._ourTransform);
                });
              }).observe(chartDiv, { subtree: true, attributeFilter: ['transform'] });
            }
          });

        playBtn.textContent = (lbPlayed && upToWk >= WEEKS[WEEKS.length-1])
          ? '↺ Replay' : '▶ Play';
        syncWkBtns(upToWk);
      }

      // ── Animation ─────────────────────────────────────────────────────────
      function startLBAnim() {
        if (lbAnimReq) { cancelAnimationFrame(lbAnimReq); lbAnimReq = null; }
        const players = LB[currentPos] || [];
        if (!players.length) return;

        rebuildColorMap();
        ensureLogos(players);
        playBtn.textContent = '◼ Stop';

        const latestWk = WEEKS[WEEKS.length-1];

        const playerMap = {};
        players.forEach(p => { playerMap[p.name] = p; });

        const weekStates = {};
        WEEKS.forEach(wk => { weekStates[wk] = stateAt(players, wk); });

        function buildStep(fromWk, toWk) {
          const from = weekStates[fromWk], to = weekStates[toWk];
          const names = new Set([...Object.keys(from), ...Object.keys(to)]);
          const ff={}, tf={};
          names.forEach(n => {
            const p = playerMap[n];
            ff[n] = from[n] || {rank:OFF_Y, pts: p ? cumulAt(p,fromWk) : 0};
            tf[n] = to[n]   || {rank:OFF_Y, pts: p ? cumulAt(p,toWk)   : 0};
          });
          return {
            ff, tf,
            fromXMax: Math.max(...Object.values(from).map(s=>s.pts), 1),
            toXMax:   Math.max(...Object.values(to).map(s=>s.pts),   1),
          };
        }

        // Step 0: bars start at their correct Week-1 rank positions with 0 pts,
        // then grow in-place to their Week-1 totals (no vertical movement).
        const steps = [];
        const s1 = weekStates[WEEKS[0]];
        const s0from = {};
        Object.entries(s1).forEach(([n, {rank}]) => { s0from[n] = {rank, pts:0}; });
        steps.push({
          ff: s0from, tf: s1,
          fromXMax: Math.max(...Object.values(s1).map(s=>s.pts), 1),  // fixed at week-1 final
          toXMax:   Math.max(...Object.values(s1).map(s=>s.pts), 1),
        });
        for (let i = 0; i < WEEKS.length-1; i++) {
          steps.push(buildStep(WEEKS[i], WEEKS[i+1]));
        }

        let stepIdx  = 0;
        let stepStart = null;
        let phase     = 'anim';   // start animating immediately (no initial pause)
        let pauseUntil = 0;

        // Show the initial state: bars in correct rank positions, pts = 0
        Plotly.react(chartDiv, buildBarTraces(s0from), barLayout(steps[0].fromXMax),
                     {responsive:true,displayModeBar:false})
          .then(() => {
            positionLogosLB({});   // no pts yet, hide logos
            syncWkBtns(WEEKS[0]);
            lbAnimReq = requestAnimationFrame(frame);
          });

        function frame(now) {
          // ── Pause phase: hold current state until pauseUntil ───────────
          if (phase === 'pause') {
            if (now < pauseUntil) {
              lbAnimReq = requestAnimationFrame(frame);
              return;
            }
            phase = 'anim';
            stepStart = null;
          }

          // ── Anim phase ─────────────────────────────────────────────────
          if (stepStart === null) stepStart = now;
          const rawT = Math.min((now - stepStart) / STEP_MS, 1);
          const te   = easeInOut(rawT);

          const {ff, tf, fromXMax, toXMax} = steps[stepIdx];
          const xMax = fromXMax + rawT * (toXMax - fromXMax);

          const ls = {};
          Object.keys(ff).forEach(name => {
            const f = ff[name], t2 = tf[name];
            const lRank = f.rank + te   * (t2.rank - f.rank);
            const lPts  = f.pts  + rawT * (t2.pts  - f.pts);
            if (lRank <= TOP5 + 1.1) ls[name] = {rank:lRank, pts:lPts};
          });

          const snapLS = Object.assign({}, ls);
          const traces = buildBarTraces(ls);

          Plotly.react(chartDiv, traces, barLayout(xMax), {responsive:true,displayModeBar:false})
            .then(() => {
              const ep = {};
              Object.entries(snapLS).forEach(([name,{rank,pts}]) => {
                if (rank <= TOP5+0.5) ep[name] = {x:pts, y:rank};
              });
              positionLogosLB(ep);
            });

          if (rawT < 1) {
            lbAnimReq = requestAnimationFrame(frame);
          } else {
            // Step done — pause at this week's completed result, then advance
            stepIdx++;
            if (stepIdx < steps.length) {
              // steps[i] completes at WEEKS[i]; after increment stepIdx-1 = completed step
              syncWkBtns(WEEKS[stepIdx - 1]);
              phase      = 'pause';
              pauseUntil = now + PAUSE_MS;
              lbAnimReq  = requestAnimationFrame(frame);
            } else {
              lbAnimReq = null;
              lbPlayed  = true;
              renderLB(latestWk);
            }
          }
        }
      }

      // ── Position tabs ─────────────────────────────────────────────────────
      POSITIONS.forEach(pos => {
        const btn = document.createElement('button');
        btn.className = 'lb-tab'+(pos===currentPos?' active':'');
        btn.textContent = pos;
        btn.addEventListener('click', () => {
          document.querySelectorAll('.lb-tab').forEach(b=>b.classList.remove('active'));
          btn.classList.add('active');
          currentPos = pos;
          lbPlayed   = false;
          renderLB(WEEKS[WEEKS.length-1]);
        });
        tabBar.appendChild(btn);
      });

      playBtn.addEventListener('click', () => {
        if (lbAnimReq) {
          cancelAnimationFrame(lbAnimReq); lbAnimReq = null;
          playBtn.textContent = '↺ Replay';
        } else {
          startLBAnim();
        }
      });

      WEEKS.forEach(wk => {
        const btn = document.createElement('button');
        btn.className = 'lb-wbtn';
        btn.dataset.week = wk;
        btn.textContent = 'Wk '+wk;
        btn.addEventListener('click', () => renderLB(wk));
        weekBtnsWrap.appendChild(btn);
      });

      window.addEventListener('resize', () => {
        if (lbAnimReq) return;
        const players = LB[currentPos] || [];
        if (!players.length) return;
        const state = stateAt(players, lbShownWk);
        const ep = {};
        Object.entries(state).forEach(([name,{rank,pts}]) => { ep[name]={x:pts,y:rank}; });
        positionLogosLB(ep);
      });

      rebuildColorMap();
      renderLB(WEEKS[WEEKS.length-1]);
    })();

    // ── build one card DOM element ─────────────────────────────────────────
    function buildCard(m, idx) {
      const isT1Win  = m.winner === m.team1;
      const winTeam  = isT1Win ? m.team1  : m.team2;
      const loseTeam = isT1Win ? m.team2  : m.team1;
      const winPts   = isT1Win ? m.final1 : m.final2;
      const losePts  = isT1Win ? m.final2 : m.final1;
      const winLogo  = isT1Win ? (m.logo1 || '') : (m.logo2 || '');
      const loseLogo = isT1Win ? (m.logo2 || '') : (m.logo1 || '');

      function logoImg(url, alt) {
        if (!url) return '';
        return '<img class="team-logo" src="' + url + '" alt="' + esc(alt) + '">';
      }

      const card = document.createElement('article');
      card.className = 'card';
      card.innerHTML =
        '<div class="card-header">' +
          '<div class="teams">' +
            logoImg(winLogo, winTeam) +
            '<span class="team winner">' + esc(winTeam)  + '</span>' +
            '<span class="sep">vs</span>' +
            logoImg(loseLogo, loseTeam) +
            '<span class="team loser">'  + esc(loseTeam) + '</span>' +
          '</div>' +
          '<div class="score-box">' +
            '<span class="sw">' + winPts.toFixed(2)  + '</span>' +
            '<span class="ss">&ndash;</span>' +
            '<span class="sl">' + losePts.toFixed(2) + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="chart-wrap">' +
          '<div class="chart-div" id="c' + idx + '"></div>' +
          '<div class="chart-overlay" id="overlay-' + idx + '">' +
            '<button class="play-btn" onclick="startAnim(' + idx + ')">&#9654;</button>' +
          '</div>' +
          '<button class="replay-btn" id="replay-' + idx + '" onclick="startAnim(' + idx + ')">&#8635; Replay</button>' +
        '</div>';

      // Inject commentary below the chart if present
      const commentaryHtml = DATA.commentary && DATA.commentary[idx];
      if (commentaryHtml) {
        const cDiv = document.createElement('div');
        cDiv.className = 'commentary';
        cDiv.innerHTML = commentaryHtml;
        card.appendChild(cDiv);
      }

      return card;
    }

    // ── render one Plotly chart ────────────────────────────────────────────
    // Charts are initially blank (empty traces) so the Play button triggers
    // the animation.  Axes are locked to their final ranges from the start so
    // the grid / day labels / separator lines are all visible immediately.
    function renderChart(m, idx) {
      const isT1Win  = m.winner === m.team1;
      const winName  = isT1Win ? m.team1  : m.team2;
      const loseName = isT1Win ? m.team2  : m.team1;
      const rawWinTDs  = isT1Win ? (m.td_markers1 || []) : (m.td_markers2 || []);
      const rawLoseTDs = isT1Win ? (m.td_markers2 || []) : (m.td_markers1 || []);

      // Filter to day windows where at least one team scored
      const activeIdx     = activeIndicesFor(m.pts1, m.pts2);
      const filteredTimes = activeIdx.map(i => DATA.times[i]);
      const filteredPts1  = activeIdx.map(i => m.pts1[i]);
      const filteredPts2  = activeIdx.map(i => m.pts2[i]);

      // Build per-matchup x-axis from the filtered times
      const { xVals: mXVals, hoverText: mHoverText,
               dayBoundaries: mDayBound, dayAnnotations: mDayAnn } =
        buildXAxis(filteredTimes);

      // Remap TD marker xi values from global time indices → new sequential indices
      const idxToNew = new Map(activeIdx.map((origI, newI) => [origI, newI]));
      function remapTDs(tds) {
        return tds.map(td => {
          const newXi = idxToNew.get(td.xi);
          if (newXi == null) return null;
          return Object.assign({}, td, { xi: newXi });
        }).filter(Boolean);
      }
      const winTDs  = remapTDs(rawWinTDs);
      const loseTDs = remapTDs(rawLoseTDs);

      const winY  = isT1Win ? filteredPts1 : filteredPts2;
      const loseY = isT1Win ? filteredPts2 : filteredPts1;

      const trajMax = Math.max(
        ...filteredPts1.filter(v => v !== null),
        ...filteredPts2.filter(v => v !== null),
        0
      );
      const yMax = Math.max(Math.max(m.final1, m.final2), trajMax) + 20;

      // Winner trace first → appears on top in the unified hover box.
      const traces = [
        { x: [], y: [],
           name: winName, mode: 'lines', yaxis: 'y',
           line: { color: C_WIN, width: 2.5 },
           hovertemplate: '%{y:.2f}<extra>' + esc(winName) + '</extra>' },
        { x: [], y: [],
           name: loseName, mode: 'lines', yaxis: 'y',
           line: { color: C_LOSE, width: 2.5 },
           hovertemplate: '%{y:.2f}<extra>' + esc(loseName) + '</extra>' },
        // TD marker dots — winner colour, revealed during animation.
        // hoverinfo:'skip' keeps them out of the unified hover box;
        // a native mousemove listener handles proximity-based tooltips.
        { x: [], y: [], text: [], mode: 'markers', showlegend: false,
           hoverinfo: 'skip',
           marker: { color: C_WIN, size: 10, symbol: 'circle',
                      line: { color: '#0d1117', width: 1.5 } } },
        // TD marker dots — loser colour
        { x: [], y: [], text: [], mode: 'markers', showlegend: false,
           hoverinfo: 'skip',
           marker: { color: C_LOSE, size: 10, symbol: 'circle',
                      line: { color: '#0d1117', width: 1.5 } } },
      ];

      // Lock x-axis to the full (filtered) data range so the grid doesn't
      // collapse when traces are empty, and autorange is suppressed during animation.
      const layout = baseLayout(yMax, mDayBound, mDayAnn);
      layout.xaxis.tickvals    = mXVals;
      layout.xaxis.ticktext    = mHoverText;
      layout.xaxis.range       = [0, mXVals.length - 1];
      layout.xaxis.autorange   = false;
      layout.yaxis.autorange   = false;

      Plotly.newPlot('c' + idx, traces, layout, plotConfig);

      // Store per-chart metadata (including filtered data) for the animation loop.
      chartMeta[idx] = { yMax, winName, loseName, winTDs, loseTDs,
                          xVals: mXVals, winY, loseY };

      // Attach proximity-based hover for TD marker dots.
      setupTdHover(idx);
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    // Wrap a string at word boundaries, inserting <br> every ~maxLen chars.
    function wrapAt(str, maxLen) {
      if (!str || str.length <= maxLen) return str;
      const words = str.split(' ');
      const lines = [];
      let line = '';
      for (const word of words) {
        const candidate = line ? line + ' ' + word : word;
        if (candidate.length > maxLen && line) {
          lines.push(line);
          line = word;
        } else {
          line = candidate;
        }
      }
      if (line) lines.push(line);
      return lines.join('<br>');
    }

    // Format a TD marker's hover text: bold player name + wrapped play description.
    function tdText(td) {
      const p = esc(td.player || '');
      // Strip jersey-number prefixes like "16-J.Goff" → "J.Goff".
      const raw = (td.desc || '').replace(/\d+-(?=[A-Z])/g, '');
      const d = wrapAt(esc(raw), 120);

      // Header line: ET time + game + quarter/clock
      let header = '';
      const timePart  = td.et_time  || '';
      const gamePart  = td.game     || '';
      const qtrPart   = td.qtr      || '';
      const clockPart = td.game_clock || '';
      if (timePart)  header += timePart;
      if (gamePart)  header += (header ? ' · ' : '') + gamePart;
      const clockStr = [qtrPart, clockPart].filter(Boolean).join(' ');
      if (clockStr)  header += (header ? ' · ' : '') + clockStr;

      let html = '';
      if (header) html += '<span style="color:#8b949e;font-size:0.75rem">' + esc(header) + '</span><br>';
      html += '<b>' + p + '</b>';
      if (d)      html += '<br>' + d;
      return html;
    }

    // Attach a native mousemove listener that shows #td-tip only when the
    // cursor is within RADIUS pixels of a visible TD marker dot.  This
    // replaces Plotly's unified-hover for markers (which fires for the entire
    // x-column) with a tight proximity check.
    const _tdTip = document.getElementById('td-tip');
    const TD_RADIUS = 15;   // pixels — how close the cursor must be

    function setupTdHover(idx) {
      const div = document.getElementById('c' + idx);

      div.addEventListener('mousemove', function(e) {
        const layout = div._fullLayout;
        if (!layout) { _tdTip.style.display = 'none'; return; }

        const xa   = layout.xaxis;
        const ya   = layout.yaxis;
        const rect = div.getBoundingClientRect();
        const mx   = e.clientX - rect.left;
        const my   = e.clientY - rect.top;

        // Convert a data-space point to pixel coords within the div.
        // l2p() returns px relative to the axis plot-area origin;
        // _offset adds the margin between the div edge and the plot area.
        function toPx(xi, y) {
          return [xa.l2p(xi) + xa._offset,
                  ya.l2p(y)  + ya._offset];
        }

        const meta = chartMeta[idx];
        if (!meta) { _tdTip.style.display = 'none'; return; }

        const allTDs = [...(meta.winTDs || []), ...(meta.loseTDs || [])];
        let closest = null, minD = TD_RADIUS;

        for (const td of allTDs) {
          try {
            const [px, py] = toPx(td.xi, td.y);
            const d = Math.hypot(mx - px, my - py);
            if (d < minD) { minD = d; closest = td; }
          } catch (_) {}
        }

        if (closest) {
          _tdTip.innerHTML = tdText(closest);
          _tdTip.style.display = 'block';
          // Anchor to the bottom-right of the Plotly plot area (inside the
          // chart-wrap div), so the tip never obscures the X-axis labels below.
          // div is the chart-div; its parent is chart-wrap.
          const plotRect = (div.parentElement || div).getBoundingClientRect();
          const tipW = 340;
          const tipH = _tdTip.offsetHeight;
          // Use the Plotly y-axis bottom margin to find the true plot area bottom
          const ya = div._fullLayout && div._fullLayout.yaxis;
          const plotBottom = ya
            ? plotRect.top + ya._offset + ya._length
            : plotRect.bottom - 30;   // fallback: leave 30px for x-axis labels
          _tdTip.style.maxWidth = tipW + 'px';
          _tdTip.style.left = (plotRect.right - tipW - 12) + 'px';
          _tdTip.style.top  = (plotBottom     - tipH - 8)  + 'px';
        } else {
          _tdTip.style.display = 'none';
        }
      });

      div.addEventListener('mouseleave', function() {
        _tdTip.style.display = 'none';
      });
    }

    // ── Animation state ────────────────────────────────────────────────────
    // chartMeta[idx]  – { yMax, winName, loseName } set by renderChart
    // animState[idx]  – { rafId } for cancellation on replay
    const chartMeta  = {};
    const animState  = {};
    const ANIM_DURATION = 10000;  // ms for a full left-to-right reveal

    function startAnim(idx) {
      // Pull filtered data stored by renderChart — xVals, winY, loseY are all
      // already sliced to the active day windows for this matchup.
      const { winTDs, loseTDs, xVals: mXVals, winY, loseY } = chartMeta[idx];

      // Cancel any running animation for this chart
      if (animState[idx] && animState[idx].rafId) {
        cancelAnimationFrame(animState[idx].rafId);
      }
      animState[idx] = { rafId: null };

      // Hide overlay + replay button, reset all four traces to empty
      document.getElementById('overlay-' + idx).classList.add('hidden');
      document.getElementById('replay-' + idx).style.display = 'none';
      Plotly.restyle('c' + idx, { x: [[], []], y: [[], []] }, [0, 1]);
      Plotly.restyle('c' + idx, { x: [[], []], y: [[], []], text: [[], []] }, [2, 3]);

      const N     = mXVals.length;
      const state = animState[idx];
      const start = performance.now();

      function frame(now) {
        const t = Math.min((now - start) / ANIM_DURATION, 1);
        const n = Math.max(1, Math.ceil(t * N));   // linear — constant speed

        // Update line traces
        Plotly.restyle('c' + idx, {
          x: [mXVals.slice(0, n), mXVals.slice(0, n)],
          y: [winY.slice(0, n),   loseY.slice(0, n)],
        }, [0, 1]);

        // Update TD marker traces: show only markers whose minute index < n
        const visWin  = winTDs.filter(td => td.xi < n);
        const visLose = loseTDs.filter(td => td.xi < n);
        Plotly.restyle('c' + idx, {
          x:    [visWin.map(td => td.xi),   visLose.map(td => td.xi)],
          y:    [visWin.map(td => td.y),    visLose.map(td => td.y)],
          text: [visWin.map(tdText),         visLose.map(tdText)],
        }, [2, 3]);

        if (t < 1) {
          state.rafId = requestAnimationFrame(frame);
        } else {
          // Final frame: ensure complete data for all traces
          Plotly.restyle('c' + idx, {
            x: [mXVals, mXVals],
            y: [winY,   loseY],
          }, [0, 1]);
          Plotly.restyle('c' + idx, {
            x:    [winTDs.map(td => td.xi),  loseTDs.map(td => td.xi)],
            y:    [winTDs.map(td => td.y),   loseTDs.map(td => td.y)],
            text: [winTDs.map(tdText),        loseTDs.map(tdText)],
          }, [2, 3]);
          document.getElementById('replay-' + idx).style.display = 'block';
        }
      }

      state.rafId = requestAnimationFrame(frame);
    }

    // ── main render loop ───────────────────────────────────────────────────
    const grid = document.getElementById('grid');
    DATA.matchups.forEach((m, i) => {
      grid.appendChild(buildCard(m, i));
      renderChart(m, i);
    });

    // ── Twitter widget script (loaded only when needed) ────────────────────
    if (DATA.needs_twitter) {
      const s = document.createElement('script');
      s.async = true;
      s.src = 'https://platform.twitter.com/widgets.js';
      document.body.appendChild(s);
    }
  </script>
</body>
</html>
